name: Publish Lab 3

on:
  schedule:
    - cron: '0 1 29 10 *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish lab3/lab3.ipynb
        run: |
          git config --global user.name "ArtemkaGh0st1k"
          git config --global user.email "artem4uk.6class.october@yandex.ru"
          
          git checkout origin/draft -- lab3/lab3.ipynb
          git checkout origin/draft -- lab3/example_input.bmp
          
          git add lab3/
          export GIT_AUTHOR_DATE="2026-10-29T01:00:00Z"
          export GIT_COMMITTER_DATE="2026-10-29T01:00:00Z"
          
          git commit -m "Add Lab 3 notebook"
          git push origin main